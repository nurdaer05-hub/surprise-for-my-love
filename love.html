<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome ❤️</title>

<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
overflow:hidden;
}

.box{
background:white;
padding:40px;
border-radius:20px;
width:350px;
box-shadow:0 10px 25px rgba(0,0,0,.2);
}

h1{
color:#ff4d6d;
}

p{
font-size:18px;
line-height:1.8;
color:#444;
}

button{
padding:12px 30px;
background:#ff4d6d;
color:white;
border:none;
border-radius:30px;
font-size:18px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#e63b5d;
}

.heart{
position:fixed;
color:red;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-50px);
}
100%{
transform:translateY(110vh);
}
}
</style>
</head>

<body>

<div class="box">

<h1>❤️ แฮร่ ❤️</h1>

<p>
ในที่สุดก็เข้ามาได้แล้วนะ 😊<br><br>

เว็บไซต์นี้...<br>
เค้าตั้งใจทำเพื่อคนพิเศษที่สุด<br><br>

Happy Anniversary ❤️
</p>

<button onclick="location.href='gallery.html'">
ไปต่อ ➜
</button>

</div>

<script>
for(let i=0;i<40;i++){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"%";
h.style.top="-50px";
h.style.fontSize=(20+Math.random()*20)+"px";
h.style.animationDuration=(3+Math.random()*5)+"s";
document.body.appendChild(h);
}
</script>

</body>
</html>
