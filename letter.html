<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 จดหมายถึงเธอ</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ffd6e8,#fff8fb);
overflow-x:hidden;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
text-align:center;
}

.card{
background:white;
padding:35px;
border-radius:25px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
}

h1{
color:#ff4d88;
margin-bottom:20px;
}

#text{
font-size:22px;
line-height:2;
color:#555;
min-height:260px;
white-space:pre-line;
text-align:left;
}

video{
margin-top:30px;
width:100%;
max-width:700px;
border-radius:20px;
box-shadow:0 10px 20px rgba(0,0,0,.2);
}

button{
margin-top:30px;
padding:15px 35px;
border:none;
border-radius:40px;
background:#ff4d88;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff2f72;
transform:scale(1.05);
}

.heart{
position:fixed;
top:-20px;
font-size:20px;
animation:fall linear infinite;
pointer-events:none;
}

@keyframes fall{

0%{
transform:translateY(-50px);
opacity:1;
}

100%{
transform:translateY(110vh);
opacity:0;
}

}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>💌 ถึงคนที่เค้ารักที่สุด 💌</h1>

<div id="text"></div>

<video controls>
<source src="วิดีโอ-1.mp4" type="video/mp4">
</video>

<br>

<button onclick="location.href='video.html'">
หน้าถัดไป ❤️
</button>

</div>

</div>

<script>

const message=`

ถึงที่รัก ❤️

ขอบคุณที่เข้ามาเป็นส่วนหนึ่งของชีวิตเค้า

ขอบคุณที่อยู่ข้างกันในวันที่มีความสุข
และวันที่เค้าอ่อนแอ

ทุกช่วงเวลาที่มีเธอ
คือช่วงเวลาที่ดีที่สุดของเค้า

เค้าหวังว่าเราจะจับมือกัน
สร้างความทรงจำดี ๆ ไปอีกนาน

Happy Anniversary ❤️

เค้ารักเธอที่สุดนะ 🤍

`;

let i=0;

function typing(){

if(i<message.length){

document.getElementById("text").innerHTML+=message.charAt(i);

i++;

setTimeout(typing,60);

}

}

typing();

for(let j=0;j<60;j++){

let h=document.createElement("div");

h.innerHTML="❤️";

h.className="heart";

h.style.left=Math.random()*100+"%";

h.style.fontSize=(15+Math.random()*25)+"px";

h.style.animationDuration=(4+Math.random()*6)+"s";

h.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(h);

}

</script>

</body>
</html>
